        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Start Suite Api V1 Runs Post
    get:
      tags:
      - runs
      summary: List Runs
      description: 1.0 ``:7648``。
      operationId: list_runs_api_v1_runs_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          default: '1'
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          default: '20'
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Runs Api V1 Runs Get
        '422':
          description: Validation Error
