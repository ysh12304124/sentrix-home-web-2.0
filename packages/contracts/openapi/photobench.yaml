  /api/v1/assets/{asset_id}/file:
    get:
      tags:
      - assets
      summary: Get Asset File
      description: '1.0 ``:7724-7730``。非法 id → 400 ``invalid asset id``；上游 HTTP 错误
        →


        ``{"error": "asset proxy failed: {code}"}`` 且状态码同上游。


        **``asset_id`` 用 ``:path`` 收**：1.0 是在**整条路径**上判

        ``startswith("/api/assets/") and endswith("/file")``，所以 ``/api/assets/a/b/file``

        会走到「id 里有 ``/`` → 400」。用普通的 ``{asset_id}``，那条请求在 2.0 会先撞上

        路由不匹配，回的是 FastAPI 的 404 ``{"detail": ...}``——形状与 1.0 不同。'
      operationId: get_asset_file_api_v1_assets__asset_id__file_get
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
