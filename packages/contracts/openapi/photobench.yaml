openapi: 3.1.0
info:
  title: PhotoBench
  version: 0.1.0
paths:
  /api/v1/runs:
    post:
      tags:
      - suites
      summary: Start Suite
      description: '``POST /api/runs``（1.0 ``:7854`` 分支 → ``start_suite`` ``:7306``）。'
      operationId: start_suite_api_v1_runs_post
