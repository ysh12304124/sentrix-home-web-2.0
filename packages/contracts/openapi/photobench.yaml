  /api/v1/analyses/{job_id}/cases:
    get:
      tags:
      - error-analysis
      summary: Cases
      operationId: cases_api_v1_analyses__job_id__cases_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: format
        in: query
        required: false
        schema:
          enum:
          - html
          - json
          - csv
          type: string
          default: html
          title: Format
      - name: score
        in: query
        required: false
        schema:
          enum:
          - ''
          - '0'
          - '1'
          - '2'
          - None
          - low
          type: string
          default: ''
          title: Score
      - name: recovery
        in: query
        required: false
        schema:
          enum:
          - ''
          - recovered
          - not_recovered
          - unknown
          type: string
          default: ''
          title: Recovery
      - name: anomaly
        in: query
        required: false
        schema:
          enum:
          - ''
          - 'yes'
          - 'no'
          type: string
          default: ''
          title: Anomaly
      - name: content_unit
        in: query
        required: false
        schema:
          enum:
          - ''
          - qa
          - turn
          type: string
          default: ''
          title: Content Unit
      - name: behavior_result
        in: query
        required: false
        schema:
          enum:
          - ''
          - correct
          - incorrect
          - missing
          type: string
          default: ''
          title: Behavior Result
      - name: turn
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Turn
      - name: index
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Index
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 500
          default: ''
          title: Q
      - name: code
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Code
      - name: question_type
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Question Type
      - name: expected_action
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Expected Action
      - name: actual_action
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Actual Action
      - name: execution
        in: query
        required: false
        schema:
          enum:
          - ''
          - normal
          - failed
          - cancelled
          - unknown
          type: string
          default: ''
          title: Execution
