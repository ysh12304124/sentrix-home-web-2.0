  /api/v1/albums/{album}/{coll}/{file_name}:
    get:
      tags:
      - datasets
      summary: Album Media
      description: '1.0 ``:7713`` + ``_resolve_album_media_file``（``:1188``）+ ``_serve_file``（``:8020``）。


        **``file_name`` 用 ``:path`` 收**：1.0 是 ``split("/", 2)``，所以第三段可以带子目录

        （``photos/2026/a.jpg``）。用普通的 ``{file_name}`` 会让带子目录的名字落到 404 上。


        **Range 不手写。** 1.0 的 ``_serve_file``（``:8020`` 起）自己解析 ``Range`` 并把

        视频按段发；2.0 的 starlette 是 1.6.0，``FileResponse`` 原生支持 Range

        （``responses.py:341`` 的 ``__call__``），非法 Range 也有同样的 416 +

        ``Content-Range: bytes */<size>``。照抄那 60 行只会多一份会漂的实现。


        **一处真实差异**：格式错误的 Range（比如 ``bytes=abc``）starlette 回 **400**，

        而 1.0 的 ``re.fullmatch`` 不匹配时回 **416**。两者都带不了 body，且浏览器不会

        发这种头，所以照 starlette 的行为走，登记在行为基线里。'
      operationId: album_media_api_v1_albums__album___coll___file_name__get
      parameters:
      - name: album
        in: path
        required: true
        schema:
          type: string
          title: Album
      - name: coll
        in: path
        required: true
        schema:
          type: string
          title: Coll
      - name: file_name
        in: path
        required: true
        schema:
          type: string
          title: File Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
