[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# judge 的三段提示词是**逐字照搬** 1.0 的常量（`benchmark_orchestrator.py:455`），
# 与 `ANSWER_QUALITY_RUBRICS` 一样是一整段连续的中文文本。E501 约束的是代码的
# 行宽；在这里它只会逼出「往提示词里插换行」——那会改变发给模型的字节，也改变
# 判分口径。**把这条豁免钉在一个文件上，而不是全局**。
"apps/photobench/src/photobench/domain/runs/judge.py" = ["E501"]

# Pinned upstream evaluator: retain algorithm bodies; prompts are versioned text.
"apps/photobench/src/photobench/domain/evaluation/atm/*.py" = ["SIM", "F841"]
"apps/photobench/src/photobench/domain/evaluation/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
# photobench 是**另一个发行包**（apps/photobench），不是 sentrix 的子包：设计文档
# §145 定死「PhotoBench 不得读取主产品 Python 内部模块」。两个都是本仓库的一等包。
known-first-party = ["sentrix", "photobench"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path"]

# 边界扩到全包 + scripts：实测 infrastructure / api / bootstrap / main / config 在
# --strict 下本来就是全绿，只查 domain + application 是把已经干净的两层漏在门外。
# 这是对设计 §6.2 边界决定的变更（原定只查 domain + application）。
[tool.mypy]
python_version = "3.11"
strict = true
# 用户 2026-10-04 裁决 §3.5：PhotoBench 受与 apps/api 同一套门禁，所以它也在
# strict 的检查范围内——不是等它长到 9,300 行才补。
files = ["apps/api/src/sentrix", "apps/photobench/src", "scripts"]

# 第三方包缺 stub / py.typed 是环境事实，不是本仓库代码的问题：集中在配置里表达，
# 而不是在每个 import 上散落 # type: ignore——那会把「这里真的有问题」也一起静音。
[[tool.mypy.overrides]]
module = ["pillow_heif", "yaml", "cn_clip", "cn_clip.*", "Katna", "Katna.*"]
ignore_missing_imports = true

# 地点解析的两个第三方包都没有 py.typed，也没有可用的独立 stub（scipy 有 scipy-stubs，
# 但它把 cKDTree 也标成 Any，装它只是换一种静音方式）。同一条规则：缺 stub 是环境
# 事实，集中写在配置里，而不是在每个 import 上散落 # type: ignore。
[[tool.mypy.overrides]]
module = ["PyGeoCN", "PyGeoCN.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# 人脸链路的三个包都没有 py.typed：onnxruntime / insightface 是 C++ 扩展的 Python 壳，
# cv2 连 .pyi 都没有。同一条规则——缺 stub 是环境事实，集中写在这里，而不是在每个 import
# 上散落 # type: ignore。**这条只关掉「找不到类型」，关不掉「用法写错了」**：本仓库自己
# 包住它们的那两个模块（models/onnx_runtime.py、models/face_detector.py）仍然在 strict
# 检查范围内，它们的函数签名与 numpy 运算都是有类型的。
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "insightface", "insightface.*", "cv2", "cv2.*"]
ignore_missing_imports = true

# 迁移期的差分脚本（``scripts/diff_photobench_reports.py``）按路径 import 1.0 的
# ``benchmark_orchestrator``——**那份代码不在本仓库里**，它是被迁移的一方，所以没有
# stub 可找。与上面几条同一条规矩：缺 stub 是环境事实，集中在配置里表达，
# 而不是散落 ``# type: ignore``。
[[tool.mypy.overrides]]
module = ["benchmark_orchestrator"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# 两个 app 的测试都进默认收集：PhotoBench 的用例不能被「记得单独跑」这件事决定跑不跑。
testpaths = ["apps/api/tests", "apps/photobench/tests"]
addopts = "-q --strict-markers"
markers = [
    "real_environment: requires real album data, model services or face weights; explicit integration gate",
]

[tool.coverage.run]
# photobench.application 在 S9b-1 建出来了，按 sentrix 的口径加进覆盖率门禁
# （domain + application 是「规则与用例」两层，infrastructure / api 不在其中）。
source = ["sentrix.domain", "sentrix.application", "photobench.domain", "photobench.application"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_packages = ["sentrix", "photobench"]
# domain-purity 的 forbidden_modules 里有 fastapi/sqlite3/PIL 等外部包，
# 不开这个开关 import-linter 会直接拒绝加载配置（契约一个都注册不上）。
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain-purity"
id = "domain-purity"
type = "forbidden"
source_modules = ["sentrix.domain"]
# os / qdrant_client 在设计 §2.3 里被点名禁止，这里必须补齐——少一条就等于那张表
# 只约束住了它列出的那几个包。
forbidden_modules = [
    "fastapi",
    "sqlite3",
    "PIL",
    "httpx",
    "uvicorn",
    "os",
    "qdrant_client",
    "sentrix.infrastructure",
    "sentrix.api",
    "sentrix.application",
    "sentrix.bootstrap",
]

[[tool.importlinter.contracts]]
name = "application-purity"
id = "application-purity"
type = "forbidden"
source_modules = ["sentrix.application"]
forbidden_modules = [
    "fastapi",
    "sqlite3",
    "PIL",
    "httpx",
    "sentrix.infrastructure",
    "sentrix.api",
    "sentrix.bootstrap",
]

[[tool.importlinter.contracts]]
name = "api-transport-only"
id = "api-transport-only"
type = "forbidden"
# 只查直接 import：api 必须经 bootstrap.container 取依赖，
# 而 container 必然间接摸到 sqlite3/PIL/infrastructure——不关掉传递检查这条契约永远红。
allow_indirect_imports = true
source_modules = ["sentrix.api"]
forbidden_modules = ["sqlite3", "PIL", "sentrix.infrastructure"]

# infrastructure 与 bootstrap 原先不在任何契约里，等于两层无人约束。
# infrastructure 只实现 domain 的 port，不许反向依赖上层。
[[tool.importlinter.contracts]]
name = "infrastructure-purity"
id = "infrastructure-purity"
type = "forbidden"
source_modules = ["sentrix.infrastructure"]
forbidden_modules = ["sentrix.api", "sentrix.application", "sentrix.bootstrap", "sentrix.main"]

# ---- PhotoBench（apps/photobench）----
#
# 用户 2026-10-04 裁决 §3.5：PhotoBench 与 apps/api 受**同一套**分层契约，所以
# domain / infrastructure 两层各有各的 forbidden 名单，而不是共用一份。
#
# **S9a 只注册了这两条，是有意的**：`photobench.application` / `photobench.api` /
# `photobench.main` 现在还不存在（S9b 的 T911–T913 才建），而 import-linter 的
# `forbidden` 契约引用一个不存在的模块会直接加载失败。S9b 建出那两层时，按这里的
# 体例补 `photobench-application-purity` 与 `photobench-layers` 两条。
[[tool.importlinter.contracts]]
name = "photobench-domain-purity"
id = "photobench-domain-purity"
type = "forbidden"
source_modules = ["photobench.domain"]
# 与 sentrix.domain 逐条对齐（含 os 与 httpx）：PhotoBench 的遥测要读 /proc、要打
# HTTP 探活，那正是这条契约要挡在 domain 之外的东西。
forbidden_modules = [
    "fastapi",
    "sqlite3",
    "PIL",
    "httpx",
    "uvicorn",
    "os",
    "qdrant_client",
    "photobench.infrastructure",
    "photobench.api",
    "photobench.application",
]

[[tool.importlinter.contracts]]
name = "photobench-infrastructure-purity"
id = "photobench-infrastructure-purity"
type = "forbidden"
source_modules = ["photobench.infrastructure"]
forbidden_modules = ["photobench.api", "photobench.application"]

# S9b-1 建出 application / api 两层时补的三条（S9a 施工记录第 9 条点名要补 application
# 与 layers 两条）：`forbidden` 与 `layers` 契约引用一个还不存在的源模块会**加载失败**，
# 所以 S9a 只能等这一层真的存在。三条与 sentrix 那三条逐条对齐——用户裁决 §3.5 要的是
# 「同一套门禁」，少一条就等于这层比 sentrix 的同名层松。
[[tool.importlinter.contracts]]
name = "photobench-application-purity"
id = "photobench-application-purity"
type = "forbidden"
source_modules = ["photobench.application"]
forbidden_modules = [
    "fastapi",
    "sqlite3",
    "PIL",
    "httpx",
    "photobench.infrastructure",
    "photobench.api",
    "photobench.main",
]

[[tool.importlinter.contracts]]
name = "photobench-api-transport-only"
id = "photobench-api-transport-only"
type = "forbidden"
# 同 sentrix 的 api-transport-only：只查直接 import——api 经 bootstrap.container 取依赖，
# 而 container 必然间接摸到 httpx/pathlib，不关掉传递检查这条契约永远红。
allow_indirect_imports = true
source_modules = ["photobench.api"]
forbidden_modules = ["sqlite3", "PIL", "photobench.infrastructure"]

[[tool.importlinter.contracts]]
name = "photobench-layers"
id = "photobench-layers"
type = "layers"
# photobench.main 是进程入口，只该向下调用；infrastructure 与 bootstrap 刻意不在链上
# （与 sentrix 的 layers 一致）——它们由各自那两条 forbidden 契约管。
layers = [
    "photobench.main",
    "photobench.api",
    "photobench.application",
    "photobench.domain",
]

# 设计文档 §145 的「PhotoBench 不得读取主产品 Python 内部模块」在这里变成一条可
# 机械判定的东西。没有它，那句话只是一句注释——而两个包都在同一个 venv 里，
# `import sentrix.infrastructure.persistence.database` 在任何地方都跑得通。
[[tool.importlinter.contracts]]
name = "photobench-isolation"
id = "photobench-isolation"
type = "forbidden"
source_modules = ["photobench"]
forbidden_modules = ["sentrix"]

[[tool.importlinter.contracts]]
name = "layers"
id = "layers"
type = "layers"
# sentrix.main 也要在链上：它是进程入口，只该向下调用，不许被下层反向 import。
layers = [
    "sentrix.main",
    "sentrix.api",
    "sentrix.application",
    "sentrix.domain",
]
